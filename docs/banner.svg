<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="Containers">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0D1117"/><stop offset="1" stop-color="#161B2E"/>
  </linearGradient>
  <radialGradient id="glow" cx="78%" cy="45%" r="55%">
    <stop offset="0" stop-color="#C084FC" stop-opacity=".28"/><stop offset="1" stop-color="#C084FC" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#C084FC"/><stop offset="1" stop-color="#4ADE80"/>
  </linearGradient>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1.2" fill="#FFFFFF" fill-opacity=".05"/>
  </pattern>
  <clipPath id="card"><rect width="1280" height="400" rx="28"/></clipPath>
</defs>
<g clip-path="url(#card)">
  <rect width="1280" height="400" fill="url(#bg)"/>
  <rect width="1280" height="400" fill="url(#dots)"/>
  <rect width="1280" height="400" fill="url(#glow)"/>
  <rect x="64" y="62" width="44" height="5" rx="2.5" fill="url(#acc)"/>
  <text x="120" y="70" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="3" fill="#C084FC">ANDROID · COMPOSE BASICS</text>
  <text x="62" y="150" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="64" font-weight="800" fill="#F5F6FA" letter-spacing="-1">Containers</text>
  <text x="64" y="208" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" fill="#B7BCD0">How Compose containers stack, size</text><text x="64" y="240" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" fill="#B7BCD0">and layer their children.</text>
  <g transform="translate(64,300)"><rect width="78" height="32" rx="16" fill="#C084FC" fill-opacity=".14" stroke="#C084FC" stroke-opacity=".45"/><text x="39" y="21" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#E8EAF2">Compose</text></g><g transform="translate(152.2,300)"><rect width="104" height="32" rx="16" fill="#C084FC" fill-opacity=".14" stroke="#C084FC" stroke-opacity=".45"/><text x="52" y="21" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#E8EAF2">Material 3</text></g><g transform="translate(266.2,300)"><rect width="78" height="32" rx="16" fill="#C084FC" fill-opacity=".14" stroke="#C084FC" stroke-opacity=".45"/><text x="39" y="21" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#E8EAF2">Preview</text></g>
  <g><rect x="820" y="40" width="360" height="320" rx="22" fill="#F5F6FA"/><text x="840" y="70" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="600" fill="#5A6178" text-anchor="start" >Box(Modifier.fillMaxSize())</text><rect x="840" y="90" width="200" height="100" fill="#EF4444"><animate attributeName="width" values="200;260;200" dur="3s" repeatCount="indefinite"/></rect><rect x="840" y="90" width="320" height="50" fill="#22C55E" fill-opacity=".92"><animate attributeName="y" values="90;150;90" dur="3s" repeatCount="indefinite"/></rect><text x="1000" y="270" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#1E2438" text-anchor="middle" >Box draws children</text><text x="1000" y="296" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#1E2438" text-anchor="middle" >in order — last on top</text></g>
</g>
</svg>
